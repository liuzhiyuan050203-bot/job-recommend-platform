server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: job-backend
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/job_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: job
    password: job123

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

fastapi:
  base-url: http://localhost:8000
  internal-token: ${AI_INTERNAL_TOKEN:change-me-internal-token}

# secret 至少 32 字节；可用环境变量 JWT_SECRET、JWT_EXPIRE_HOURS 覆盖
jwt:
  secret: ${JWT_SECRET:JobPlatformJwtSecretKey-2026-OK!!}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
