server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: job-backend
  mvc:
    async:
      request-timeout: 300000
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/job_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:job}
    password: ${DB_PASSWORD:job123}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

fastapi:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # 与 ai-service 的 AI_INTERNAL_TOKEN 必须一致，开发默认值仅用于本地
  internal-token: ${AI_INTERNAL_TOKEN:change-me-internal-token}

# 开发默认密钥见 JwtSecretRules.DEV_DEFAULT；生产环境由 application-prod.yml 去掉默认值
# secret 至少 32 字节；可用环境变量 JWT_SECRET、JWT_EXPIRE_HOURS 覆盖
jwt:
  secret: ${JWT_SECRET:JobPlatformJwtSecretKey-2026-OK!!}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

# 简历原件目录。相对路径相对进程工作目录；生产建议设绝对路径 UPLOAD_DIR
resume:
  upload-dir: ${UPLOAD_DIR:data/uploads}
